[project]
name = "codegen_ui"
version = "0.1.0"
description = "Web user interface for ixl code generation"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Flask>=2.2.2,<3",
    "requests>=2.28.2,<3",
    "orm-importer",
    "interlocking-exporter",
    "gunicorn>=26.2.0,<27",
    "overpy>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
orm-importer = { git = "https://github.com/simulate-digital-rail/orm-importer.git" }
interlocking-exporter = { git = "https://github.com/simulate-digital-rail/interlocking-exporter" }

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
